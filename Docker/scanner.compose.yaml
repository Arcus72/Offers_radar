services:
  scanner:
    build: ./scanner
    profiles:
      - scanner

    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    develop:
      watch:
        - action: sync+restart
          path: ./scanner
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - logs/
        - action: rebuild
          path: ./scanner/uv.lock
